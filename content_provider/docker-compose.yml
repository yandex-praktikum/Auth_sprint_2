services:
  db:
    image: postgres:16.2
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./etl:/docker-entrypoint-initdb.d
    env_file:
      - .env
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U app -d movies_database' ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movies-cluster

  etl-movies:
    build:
      context: ./
      dockerfile: ./etl/Dockerfile.movies
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - movies-cluster

  etl-persons:
    build:
      context: ./
      dockerfile: ./etl/Dockerfile.persons
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - movies-cluster

  etl-genres:
    build:
      context: ./
      dockerfile: ./etl/Dockerfile.genres
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - movies-cluster

  app:
    build:
      context: ./
      dockerfile: ./src/Dockerfile
    env_file:
      - .env
    expose:
      - "${FASTAPI_PORT}"
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - movies-cluster

  elasticsearch:
    image: elasticsearch:8.12.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://localhost:9200 || exit 1",
        ]
      interval: 2s
      timeout: 10s
      retries: 50
    networks:
      - movies-cluster


  redis:
    image: redis:7.2.4-alpine
    expose:
      - "${REDIS_PORT}"
    networks:
      - movies-cluster
volumes:
  postgres-data:
  elasticsearch-data:
  static-volume:
  media-volume:


networks:
  movies-cluster:
    name: movies-cluster