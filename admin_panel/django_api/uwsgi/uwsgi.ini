[uwsgi]
socket = :8000
protocol = http

uid = www-data
gid = www-data

master = true
no-orphans = true

die-on-term = true
single-interpreter = true

lazy-apps = true

processes = $(UWSGI_PROCESSES)
threads = $(UWSGI_THREADS)
enable-threads = true

max-requests = 5000

need-app = true
harakiri = $(UWSGI_HARAKIRI)
harakiri-verbose = true

vacuum = true

reload-mercy = 10

chdir = /Users/stepandilman/Labs/YP/DevMid/new_admin_panel_sprint_2/docker_compose/simple_project/app/
#chdir = /opt/app

wsgi-file = example/wsgi.py

post-buffering = 1048576
buffer-size = 65535
static-map = /static=/Users/stepandilman/Labs/YP/DevMid/new_admin_panel_sprint_2/docker_compose/simple_project/app/static
#static-map = /static=/opt/app/static
static-map = /media=/var/wwww/media
